# nginx/default.conf 
# Nginx configuration inside the container.
# flask-app is the docker compose service name - Docker's internal dns 
# resolves it to the flask-app container's IP automatically 

upstream flask_backend {
    server flask-app:5001; # Matches the exact service name from docker-compose.yml
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    
    # Increment body size limit (default 1MB)
    client_max_body_size 10M;

    location / {
        proxy_pass         http://flask_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme; # Fixed typo from $schema to $scheme
        proxy_set_header   Connection         "";      # Clear connection headers for keepalive
        
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s; # Fixed typo: 'proxy_connection_timeout' is not a valid Nginx directive, it must be 'proxy_connect_timeout'
    }

    location /healthz {
        proxy_pass         http://flask_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 30s;
    }
}
